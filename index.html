<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>色块抠边框</title>
<style>
:root{--bg:#10131a;--panel:#171c26;--line:#303848;--text:#eef2f7;--muted:#9aa6b8;--accent:#86e1c2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#24384b 0,#10131a 42%);color:var(--text);font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:34px 22px 50px}h1{margin:0 0 8px;font-size:32px;letter-spacing:-.03em}p{color:var(--muted);margin:0 0 22px}.app{display:grid;grid-template-columns:290px 1fr;gap:18px}.panel,.stage{background:rgba(23,28,38,.88);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 60px #0004}.panel{padding:18px}.stage{padding:18px;min-height:600px;display:flex;align-items:center;justify-content:center}.drop{border:1px dashed #526075;border-radius:12px;padding:18px;text-align:center;margin-bottom:18px}.drop input{width:100%;margin:10px 0}.row{display:flex;gap:8px;align-items:center;margin:12px 0}.row label{flex:1}.row output{width:42px;text-align:right;color:var(--accent)}input[type=range]{width:100%;accent-color:var(--accent)}button{border:1px solid #47615c;background:#21332f;color:var(--text);border-radius:10px;padding:10px 12px;cursor:pointer}button.primary{background:var(--accent);color:#102019;border-color:var(--accent);font-weight:700}button:disabled{opacity:.4;cursor:not-allowed}.hint{font-size:12px;color:var(--muted);margin-top:14px}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.chip{font-size:12px;border:1px solid var(--line);padding:5px 8px;border-radius:99px;color:var(--muted)}.canvasWrap{width:100%;height:100%;min-height:560px;display:grid;place-items:center;background-color:#fff;background-image:linear-gradient(45deg,#e9edf2 25%,transparent 25%),linear-gradient(-45deg,#e9edf2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e9edf2 75%),linear-gradient(-45deg,transparent 75%,#e9edf2 75%);background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0;border-radius:12px;overflow:hidden}.canvasWrap canvas{max-width:100%;max-height:650px;object-fit:contain;cursor:crosshair}.status{color:var(--muted);font-size:13px;margin-top:12px;min-height:20px}@media(max-width:820px){.app{grid-template-columns:1fr}.stage{min-height:420px}.canvasWrap{min-height:380px}}
</style></head>
<body><main><h1>色块抠边框</h1><p>上传图片后，先点击外部背景取样，再点击内部纯色留白取样；工具会保留边框装饰和文字，只移除相连的同色区域。</p>
<section class="app"><aside class="panel"><div class="drop"><strong>上传图片（支持批量）</strong><input id="file" type="file" accept="image/*" multiple><div class="hint">支持 PNG / JPG / WEBP，可一次选择多张</div></div>
<div class="row"><label>颜色容差</label><output id="tolOut">24</output></div><input id="tol" type="range" min="0" max="100" value="24">
<div class="row"><label>边缘柔化</label><output id="softOut">1</output></div><input id="soft" type="range" min="0" max="4" value="1">
<div class="row"><label><input id="autoInner" type="checkbox" checked> 自动识别内部区域</label></div>
<div class="row"><label><input id="deFringe" type="checkbox" checked> 清除黑色边缘</label></div>
<div class="row"><label><input id="keepCenter" type="checkbox" checked> 仅保留中间素材并裁掉上下界面</label></div>
<div class="row"><button id="modeRemove" class="primary">删除背景取样</button><button id="modeKeep">保留元素取样</button></div>
<div class="row"><button id="undo">撤销取样</button><button id="clear">重新取样</button></div>
<div class="row"><button id="process" class="primary" disabled>生成透明图</button><button id="download" disabled>下载 PNG</button></div>
<div class="row"><button id="batch" disabled>批量处理全部</button><button id="downloadAll" disabled>下载全部</button></div><div class="row"><button id="zoomOut">−</button><output id="zoomOutVal">100%</output><button id="zoomIn">＋</button><button id="fit">适应</button></div>
<div class="legend"><span class="chip">① 点击外部背景</span><span class="chip">② 点击内部纯色</span><span class="chip">棋盘格=透明</span></div><div id="status" class="status">尚未载入图片</div></aside>
<div class="stage"><div class="canvasWrap"><canvas id="canvas"></canvas></div></div></section><section id="queue" style="margin-top:18px"></section></main>
<script>
const $=id=>document.getElementById(id),c=$("canvas"),ctx=c.getContext("2d",{willReadFrequently:true});let img=null,samples=[],keeps=[],original=null,zoom=1,files=[],results=[],mode='remove';
function setStatus(s){$("status").textContent=s}
function fit(){if(!img)return;const max=1400,scale=Math.min(1,max/img.width,max/img.height);c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);ctx.drawImage(img,0,0,c.width,c.height);original=ctx.getImageData(0,0,c.width,c.height);}
$("file").onchange=e=>{files=[...e.target.files];if(files.length)load(files[0]);$("batch").disabled=files.length<2;setStatus(`${files.length} 张图片已加入队列`)};
document.querySelector(".drop").ondragover=e=>e.preventDefault();document.querySelector(".drop").ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};
function load(f){if(!f)return;const u=URL.createObjectURL(f);img=new Image();img.onload=()=>{samples=[];fit();$("process").disabled=false;$("download").disabled=true;setStatus("请点击外部背景取样；再点击内部纯色区域取样");URL.revokeObjectURL(u)};img.src=u}
c.onclick=e=>{if(!original)return;const r=c.getBoundingClientRect(),x=Math.max(0,Math.min(c.width-1,Math.round((e.clientX-r.left)*c.width/r.width))),y=Math.max(0,Math.min(c.height-1,Math.round((e.clientY-r.top)*c.height/r.height)));const d=ctx.getImageData(x,y,1,1).data;(mode==='remove'?samples:keeps).push({x,y,color:[d[0],d[1],d[2]]});ctx.fillStyle=mode==='remove'?'#86e1c2':'#ffbf69';ctx.beginPath();ctx.arc(x,y,Math.max(5,c.width/180),0,Math.PI*2);ctx.fill();setStatus(`删除取样 ${samples.length} 个，保留取样 ${keeps.length} 个`)};
$("modeRemove").onclick=()=>{mode='remove';$("modeRemove").className='primary';$("modeKeep").className='';setStatus('当前模式：点击要删除的背景色块')};$("modeKeep").onclick=()=>{mode='keep';$("modeKeep").className='primary';$("modeRemove").className='';setStatus('当前模式：点击要保留的黑白装饰、文字或细线')};
$("undo").onclick=()=>{if(samples.length){samples.pop();ctx.putImageData(original,0,0);samples.forEach(s=>{ctx.fillStyle="#86e1c2";ctx.beginPath();ctx.arc(s.x,s.y,Math.max(5,c.width/180),0,Math.PI*2);ctx.fill()})}};$("clear").onclick=()=>{samples=[];ctx.putImageData(original,0,0);setStatus("已清空取样，请重新点击色块")};
$("tol").oninput=e=>$("tolOut").textContent=e.target.value;$("soft").oninput=e=>$("softOut").textContent=e.target.value;
function removeConnected(data,w,h,seed,tol,protectedMask){if(seed<0||seed>=w*h)return;const seen=new Uint8Array(w*h),q=[seed],target=seed*4;seen[seed]=1;while(q.length){const p=q.pop(),i=p*4;if(protectedMask&&protectedMask[p])continue;const dr=data[i]-data[target],dg=data[i+1]-data[target+1],db=data[i+2]-data[target+2];if(Math.hypot(dr,dg,db)>tol)continue;data[i+3]=0;const x=p%w;for(const n of [p-1,p+1,p-w,p+w])if(n>=0&&n<w*h&&!seen[n]&&(!protectedMask||!protectedMask[n])&&((n%w)!==w-1||x!==w-1)&&((n%w)!==0||x!==0)){seen[n]=1;q.push(n)}}}
function protectRegion(data,w,h,seed,tol,mask){const q=[seed],seen=new Uint8Array(w*h),target=seed*4;seen[seed]=1;while(q.length){const p=q.pop(),i=p*4;const dr=data[i]-data[target],dg=data[i+1]-data[target+1],db=data[i+2]-data[target+2];if(Math.hypot(dr,dg,db)>tol)continue;mask[p]=1;const x=p%w;for(const n of [p-1,p+1,p-w,p+w])if(n>=0&&n<w*h&&!seen[n]&&((n%w)!==w-1||x!==w-1)&&((n%w)!==0||x!==0)){seen[n]=1;q.push(n)}}}
function clearDarkFringe(data,w,h,threshold=95,passes=3){for(let pass=0;pass<passes;pass++){const kill=[];for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const p=y*w+x,i=p*4;if(data[i+3]===0)continue;const lum=.299*data[i]+.587*data[i+1]+.114*data[i+2];if(lum>threshold)continue;let near=false;for(const n of [p-1,p+1,p-w,p+w])if(data[n*4+3]===0){near=true;break}if(near)kill.push(i)}for(const i of kill)data[i+3]=0}}
function trimAlpha(data,w,h){let l=w,t=h,r=-1,b=-1;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(data[(y*w+x)*4+3]>0){l=Math.min(l,x);r=Math.max(r,x);t=Math.min(t,y);b=Math.max(b,y)}if(r<0)return null;const nw=r-l+1,nh=b-t+1,out=new ImageData(nw,nh);for(let y=0;y<nh;y++)for(let x=0;x<nw;x++){const si=((y+t)*w+x+l)*4,di=(y*nw+x)*4;for(let k=0;k<4;k++)out.data[di+k]=data[si+k]}return out}
function removeScreenshotBands(data,w,h,tol){for(const [x,y] of [[0,0],[w-1,0],[0,h-1],[w-1,h-1],[Math.floor(w/2),0],[Math.floor(w/2),h-1]])removeConnected(data,w,h,y*w+x,tol)}
function autoSeeds(w,h){return [[Math.floor(w/2),Math.floor(h/2)],[Math.floor(w*.35),Math.floor(h*.35)],[Math.floor(w*.65),Math.floor(h*.35)],[Math.floor(w*.35),Math.floor(h*.65)],[Math.floor(w*.65),Math.floor(h*.65)]]}
$("process").onclick=()=>{if(!original)return;let out=new ImageData(new Uint8ClampedArray(original.data),original.width,original.height),tol=+$('tol').value,protect=new Uint8Array(out.width*out.height);for(const s of keeps)protectRegion(out.data,out.width,out.height,s.y*out.width+s.x,tol,protect);let work=samples.slice();if($('keepCenter').checked)removeScreenshotBands(out.data,out.width,out.height,Math.max(18,tol));if($('autoInner').checked){for(const [x,y] of autoSeeds(out.width,out.height)){const i=(y*out.width+x)*4;if(out.data[i+3]&&Math.min(out.data[i],out.data[i+1],out.data[i+2])>185)work.push({x,y})}}if(!work.length){setStatus('请至少点击一个删除背景色块');return}for(const s of work)removeConnected(out.data,out.width,out.height,s.y*out.width+s.x,tol,protect);if($('deFringe').checked)clearDarkFringe(out.data,out.width,out.height,95,3);if($('keepCenter').checked){const trimmed=trimAlpha(out.data,out.width,out.height);if(trimmed){out=trimmed;c.width=out.width;c.height=out.height}}ctx.putImageData(out,0,0);$('download').disabled=false;$('download').onclick=()=>{const a=document.createElement('a');a.download='frame-transparent.png';a.href=c.toDataURL('image/png');a.click()};setStatus('完成：已按删除/保留蒙版处理')};
function processFile(f){return new Promise(done=>{const im=new Image();im.onload=()=>{const scale=Math.min(1,1400/im.width,1400/im.height),w=Math.round(im.width*scale),h=Math.round(im.height*scale),cc=document.createElement('canvas');cc.width=w;cc.height=h;const x=cc.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);let out=x.getImageData(0,0,w,h),tol=+$('tol').value;if($('keepCenter').checked)removeScreenshotBands(out.data,w,h,Math.max(18,tol));const work=[];for(const [px,py] of autoSeeds(w,h)){const i=(py*w+px)*4;if(Math.min(out.data[i],out.data[i+1],out.data[i+2])>185)work.push({x:px,y:py})}for(const s of work)removeConnected(out.data,w,h,s.y*w+s.x,tol);if($('deFringe').checked)clearDarkFringe(out.data,w,h,95,3);if($('keepCenter').checked){const trimmed=trimAlpha(out.data,w,h);if(trimmed){out=trimmed;cc.width=out.width;cc.height=out.height}}x.putImageData(out,0,0);done({name:f.name,url:cc.toDataURL('image/png')})};im.src=URL.createObjectURL(f)})}
$("batch").onclick=async()=>{results=[];$("batch").disabled=true;setStatus(`正在处理 ${files.length} 张…`);for(const f of files){results.push(await processFile(f));setStatus(`已完成 ${results.length}/${files.length}`)}$("downloadAll").disabled=false;$("queue").innerHTML='<div class="panel"><strong>批量结果</strong><div class="hint">每张图已生成透明 PNG，可单独下载或全部下载。</div>'+results.map((r,i)=>`<div class="row"><span style="flex:1">${r.name}</span><button data-i="${i}">下载</button></div>`).join('')+'</div>';document.querySelectorAll('#queue button').forEach(b=>b.onclick=()=>{const r=results[+b.dataset.i],a=document.createElement('a');a.download=r.name.replace(/\.[^.]+$/,'')+'-transparent.png';a.href=r.url;a.click()})};
$("downloadAll").onclick=()=>results.forEach((r,i)=>setTimeout(()=>{const a=document.createElement('a');a.download=r.name.replace(/\.[^.]+$/,'')+'-transparent.png';a.href=r.url;a.click()},i*200));$("zoomIn").onclick=()=>{zoom=Math.min(3,zoom+.1);c.style.transform=`scale(${zoom})`;$('zoomOutVal').textContent=Math.round(zoom*100)+'%'};$("zoomOut").onclick=()=>{zoom=Math.max(.3,zoom-.1);c.style.transform=`scale(${zoom})`;$('zoomOutVal').textContent=Math.round(zoom*100)+'%'};$("fit").onclick=()=>{zoom=1;c.style.transform='scale(1)';$('zoomOutVal').textContent='100%'};
</script></body></html>
